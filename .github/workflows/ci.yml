name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm test

  tauri-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: EmailApp-macOS
            artifact-path: |
              client/src-tauri/target/release/bundle/dmg/*.dmg
              client/src-tauri/target/release/bundle/macos/*.app
            release-files: |
              client/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact-name: EmailApp-Windows
            artifact-path: |
              client/src-tauri/target/release/bundle/msi/*.msi
              client/src-tauri/target/release/bundle/nsis/*.exe
            release-files: |
              client/src-tauri/target/release/bundle/msi/*.msi
              client/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: client
      - run: npm run tauri:build
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.release-files }}
          fail_on_unmatched_files: false
